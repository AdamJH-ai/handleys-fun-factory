{# Round title-card visual upgrade. Timings and jingle are controlled by app.py. #}
<div id="round-intro-content" class="hff-round-intro">
    <h2>Round {{ game_round_num }} / {{ game_rounds_total }}</h2>

    {% if round_big_logo %}
        <img class="hff-round-hero-logo"
             src="{{ url_for('static', filename=round_big_logo) }}"
             alt="{{ round_type_name }}"
             decoding="async">
    {% else %}
        <h1>{{ round_type_name or 'Next Round!' }}</h1>
    {% endif %}

    <p class="hff-round-intro-rules">{{ round_rules or 'Get ready!' }}</p>
</div>
